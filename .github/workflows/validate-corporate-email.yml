name: Validate corporate email and attachment branding
on:
  pull_request:
    paths:
      - 'supabase/functions/audit-email-dispatch/**'
      - 'apps-script/arquem-relatorios-anexos.gs'
      - 'tests/corporate-email-policy.test.ts'
      - '.github/workflows/validate-corporate-email.yml'
  workflow_dispatch:
jobs:
  corporate-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate email function TypeScript
        run: deno check supabase/functions/audit-email-dispatch/index.ts
      - name: Validate content policy and HTML layout
        run: deno test tests/corporate-email-policy.test.ts
      - name: Validate Apps Script JavaScript syntax
        run: node --check <(sed 's/\\r$//' apps-script/arquem-relatorios-anexos.gs)
        shell: bash
