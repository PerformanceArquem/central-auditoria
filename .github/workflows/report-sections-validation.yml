name: Validar permissões de relatórios

on:
  pull_request:
    paths:
      - 'supabase/functions/audit-email-dispatch/**'
      - '.github/workflows/report-sections-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check section permission tests
        run: deno check supabase/functions/audit-email-dispatch/report-sections_test.ts
      - name: Check full Edge Function and imports
        run: deno check supabase/functions/audit-email-dispatch/index.ts
      - name: Verify jornada gap calculations
        run: deno test supabase/functions/audit-email-dispatch/journey-gaps_test.ts
      - name: Run all 8 combinations and legacy cases
        run: deno test supabase/functions/audit-email-dispatch/report-sections_test.ts
      - name: Verify Keila contains no ratings or CSAT
        run: deno test supabase/functions/audit-email-dispatch/production-flow-keila_test.ts
      - name: Check Apps Script JavaScript syntax
        run: |
          cp apps-script/arquem-relatorios-anexos.gs /tmp/arquem-relatorios-anexos.js
          node --check /tmp/arquem-relatorios-anexos.js
