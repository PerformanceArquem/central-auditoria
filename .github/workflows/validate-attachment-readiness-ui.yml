name: Validate attachment readiness UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/attachment-readiness-ui.test.mjs'
      - '.github/workflows/validate-attachment-readiness-ui.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authenticated read-only attachment check
        run: node --test tests/attachment-readiness-ui.test.mjs
