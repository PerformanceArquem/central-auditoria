name: Validate Ticket Manager assistant without actions
on:
  pull_request:
    paths: ['api/ticket-manager-assistant.js', 'lib/ticket-manager-assistant.cjs', 'ai-reports.js', 'tests/ticket-manager-assistant.test.mjs', '.github/workflows/validate-ticket-manager-assistant.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check ai-reports.js
      - run: node --check lib/ticket-manager-assistant.cjs
      - run: node --test tests/ticket-manager-assistant.test.mjs tests/ai-reports.test.mjs
