name: Auditar instalacao Google Apps Script sem envio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/central-auditoria-emails-completo.gs'
      - 'scripts/audit-appsscript-project.mjs'
      - '.github/workflows/audit-appsscript-installation.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Ler e conferir o projeto existente (sem alterar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar credencial autorizada
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON ausente. Nao e possivel ler a instalacao Apps Script."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{JSON.parse(s);})'
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Instalar CLI oficial
        run: npm install --no-save @google/clasp@3
      - name: Consultar projeto original sem gravar
        run: |
          mkdir -p "$RUNNER_TEMP/apps-script-audit"
          cd "$RUNNER_TEMP/apps-script-audit"
          printf '%s' '{"scriptId":"1WUhIenOGO-B_jAkYgECmpBq-jMeeFrTghwElVyBdKLTTICWnFzgkWmm8"}' > .clasp.json
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          node "$GITHUB_WORKSPACE/scripts/audit-appsscript-project.mjs" "$PWD" "$GITHUB_WORKSPACE/apps-script/central-auditoria-emails-completo.gs" >> "$GITHUB_STEP_SUMMARY"
      - name: Descartar credenciais locais
        if: always()
        run: rm -f "$HOME/.clasprc.json"

# Nenhum comando clasp push / deploy / run aqui: auditoria exclusivamente de leitura.
