name: Validate automatic CC preflight
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/charge-cc-auto-preflight.test.mjs'
      - '.github/workflows/validate-cc-auto-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/charge-cc-auto-preflight.test.mjs
