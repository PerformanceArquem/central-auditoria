name: Validate isolated audit UI with Chromium
on:
  pull_request:
    paths:
      - 'index.html'
      - 'audit-readonly-insights-ui.js'
      - 'audit-alert-policy-ui.js'
      - 'audit-queue-flow-ui.js'
      - 'audit-quality-review-ui.js'
      - 'audit-productivity-preview-ui.js'
      - 'tests/audit-visual-smoke.test.mjs'
      - '.github/workflows/validate-audit-visual-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # Prevent external cloud calls: all browser API responses are fictitious.
      QUALITY_GEMINI_DRAFT_ENABLED: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency only in disposable runner
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
          npx --no-install playwright install --with-deps chromium
      - name: Execute visual smoke with fictitious data and blocked external network
        run: node --test tests/audit-visual-smoke.test.mjs
      - name: Store synthetic screenshots for review (no production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-five-stage-fake-ui-screenshots
          path: artifacts/audit-visual-smoke/*.png
          retention-days: 7
          if-no-files-found: ignore
