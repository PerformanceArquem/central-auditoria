name: Validate cache-first loading and alerts performance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/alerts-performance-cache-first.test.mjs'
      - '.github/workflows/validate-cache-first-alerts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/alerts-performance-cache-first.test.mjs
