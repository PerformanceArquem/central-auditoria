name: Validate Mini Central de Monitoria

on:
  pull_request:
    paths:
      - 'supabase/functions/monitoria-ai/**'
      - 'monitoria-ui.js'
      - 'index.html'
      - '.github/workflows/validate-monitoria-gemini.yml'
  push:
    branches: ['feature/mini-central-monitoria-gemini-20261117']
    paths:
      - 'supabase/functions/monitoria-ai/**'
      - 'monitoria-ui.js'
      - 'index.html'
      - '.github/workflows/validate-monitoria-gemini.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate the rule engine without credentials or external calls
        run: deno test supabase/functions/monitoria-ai/scoring.test.ts
      - name: Check Edge Function types
        run: deno check supabase/functions/monitoria-ai/index.ts
      - name: Verify browser script syntax
        run: node --check monitoria-ui.js
