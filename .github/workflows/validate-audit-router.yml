name: Validate consolidated audit routing
on:
  pull_request:
    paths: ['api/**', 'server/**', 'vercel.json', 'tests/audit-router.test.mjs', '.github/workflows/validate-audit-router.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/audit-router.test.mjs tests/ticket-inspection-api.test.mjs tests/production-flow-api.test.mjs tests/forecast-api.test.mjs
