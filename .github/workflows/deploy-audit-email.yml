name: Deploy Supabase - Email Dispatch

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/audit-email-dispatch/**'
      - '.github/workflows/deploy-audit-email.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-audit-email-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar audit-email-dispatch
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dvaaicqajlppuigeyejr
    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar token de deploy
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o secret SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar apenas a funcao de e-mail
        run: supabase functions deploy audit-email-dispatch --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
