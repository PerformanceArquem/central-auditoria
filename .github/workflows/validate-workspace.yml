name: Validate workspace performance
on:
  push:
    branches: [main]
  pull_request:
    paths: ['index.html', 'ui/**', 'tests/workspace-performance.test.mjs', '.github/workflows/validate-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ui/workspace.js
      - run: node --test tests/workspace-performance.test.mjs tests/email-admin-ui.test.mjs tests/alert-column-filter.test.mjs
