name: Validate forecast audit API
on:
  pull_request:
    paths:
      - 'api/audit-forecast-variances.js'
      - 'tests/forecast-api.test.mjs'
      - '.github/workflows/validate-forecast-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test forecast endpoint security and data mapping
        run: node --test tests/forecast-api.test.mjs
