name: Validate table column filters
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - index.html
      - tests/alert-column-filter.test.mjs
      - .github/workflows/validate-alert-column-filter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate filter mapping and visibility
        run: node --test tests/alert-column-filter.test.mjs
