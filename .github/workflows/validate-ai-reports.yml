name: Validate AI custom reports
on:
  pull_request:
    paths:
      - 'ai-reports.js'
      - 'index.html'
      - 'supabase/functions/audit-ai-reports/**'
      - 'tests/ai-reports.test.mjs'
      - '.github/workflows/validate-ai-reports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ai-reports.js
      - run: node --test tests/ai-reports.test.mjs
