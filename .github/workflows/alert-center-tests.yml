name: Alert center dry-run tests
on:
  push:
    branches: [main, feat-movidesk-alert-center]
    paths: ['alert-center/**', 'supabase/functions/alert-center-*/**', '.github/workflows/alert-center-tests.yml']
  pull_request:
    branches: [main]
    paths: ['alert-center/**', 'supabase/functions/alert-center-*/**', '.github/workflows/alert-center-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test alert-center/*.test.mjs
