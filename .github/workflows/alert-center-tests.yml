name: Alert center dry-run tests
on:
  push:
    branches: [main, feat-movidesk-alert-center, feat/alert-center-email-six-sectors, test/alert-email-yesterday-alan-20261126]
    paths: ['alert-center/**', 'supabase/functions/alert-center-*/**', '.github/workflows/alert-center-tests.yml']
  pull_request:
    branches: [main]
    paths: ['alert-center/**', 'supabase/functions/alert-center-*/**', '.github/workflows/alert-center-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test alert-center/*.test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/alert-center-email-dispatch/index.ts

      - run: deno check supabase/functions/alert-center-email-test/index.ts
